name: Publish npm package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust tests
        run: cargo test --locked

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            executable: bo
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x64
            executable: bo
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
            executable: bo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            executable: bo.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare npm binary artifact
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.platform }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.platform }}/${{ matrix.executable }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Download npm binaries
        uses: actions/download-artifact@v4
        with:
          path: npm/bin
          merge-multiple: false

      - name: Prepare executable permissions
        run: chmod +x npm/bin/linux-x64/bo npm/bin/darwin-x64/bo npm/bin/darwin-arm64/bo

      - name: Verify packaged CLI
        run: node npm/bo.js --version

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
